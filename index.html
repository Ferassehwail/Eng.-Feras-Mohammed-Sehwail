
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تنبيه: تم الانتقال إلى الموقع الجديد | المهندس فراس سحويل</title>
<meta name="description" content="الموقع الرسمي للمهندس فراس سحويل - تم إيقاف هذا الموقع والانتقال إلى المنصة الجديدة بالكامل.">

<meta property="og:title" content="المهندس فراس سحويل">
<meta property="og:description" content="تم إيقاف هذا الموقع والانتقال إلى الموقع الجديد. نتشرف بزيارتكم.">
<meta property="og:image" content="https://i.postimg.cc/Gmq96y4R/347590685-273239908641467-8867587916477147235-n.jpg">

<style>
@font-face {
    font-family: 'Tajawal';
    src: url('/font/Tajawal-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: 'Tajawal';
    src: url('/font/Tajawal-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: 'Zain';
    src: url('/font/Zain-Black.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
}

:root {
    --primary: #16a064;
    --primary-dark: #087046;
    --secondary: #2563eb;
    --ink: #143047;
    --muted: #64748b;
    --font-body: 'Tajawal', Arial, sans-serif;
    --font-heading: 'Tajawal', Arial, sans-serif;
    --font-name: 'Zain', 'Tajawal', Arial, sans-serif;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: var(--font-body);
    background: #f4f9f5;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

/* خلفية متحركة فخمة */
.bg-gradient {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: 
        radial-gradient(circle at 10% 20%, rgba(22, 160, 100, 0.08) 0%, transparent 40rem),
        radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.06) 0%, transparent 40rem),
        linear-gradient(180deg, #f8fbff 0%, #edf7f1 100%);
    animation: pulseBg 12s ease-in-out infinite alternate;
}

@keyframes pulseBg {
    0% { transform: scale(1); }
    100% { transform: scale(1.05); }
}

.container {
    width: 100%;
    max-width: 650px;
    padding: 20px;
    perspective: 1000px;
}

/* بطاقة التصميم الزجاجي */
.redirect-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(22, 160, 100, 0.2);
    border-radius: 32px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(20, 48, 71, 0.08);
    transform: translateY(0);
    animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.profile-img-container {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 24px;
}

.profile-image {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #fff;
    box-shadow: 0 10px 25px rgba(20, 48, 71, 0.12);
}

/* شارة إشعار التوقف */
.status-badge {
    position: absolute;
    bottom: -5px;
    right: 5px;
    background: #ef4444;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
    border: 2px solid #fff;
}

.notice-tag {
    display: inline-block;
    background: rgba(239, 68, 68, 0.08);
    color: #dc2626;
    padding: 6px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 16px;
    border: 1px solid rgba(239, 68, 68, 0.15);
}

.name-title {
    font-family: var(--font-name);
    font-size: clamp(32px, 5vw, 48px);
    color: var(--primary-dark);
    margin: 0 0 12px 0;
    line-height: 1.1;
}

.msg-text {
    color: var(--ink);
    font-size: 18px;
    line-height: 1.7;
    margin: 0 0 24px 0;
    font-weight: 500;
}

/* صندوق الترحيب الفخم */
.welcome-box {
    background: linear-gradient(135deg, rgba(22, 160, 100, 0.05), rgba(37, 99, 235, 0.03));
    border: 1px dashed rgba(22, 160, 100, 0.3);
    padding: 16px;
    border-radius: 20px;
    margin-bottom: 30px;
    color: var(--primary-dark);
    font-weight: 700;
    font-size: 16px;
}

/* زر الانتقال المباشر */
.cta-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px 32px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    font-weight: 700;
    border-radius: 18px;
    box-shadow: 0 10px 25px rgba(8, 112, 70, 0.25);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.cta-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(8, 112, 70, 0.35);
}

.cta-button svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    transition: transform 0.25s ease;
}

.cta-button:hover svg {
    transform: translateX(-5px);
}

/* العداد التنازلي */
.countdown-text {
    margin-top: 24px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 500;
}

.countdown-number {
    color: var(--secondary);
    font-weight: 700;
    font-size: 16px;
    display: inline-block;
    width: 24px;
}

@media (max-width: 480px) {
    .redirect-card { padding: 30px 18px; border-radius: 24px; }
    .msg-text { font-size: 16px; }
}
</style>
</head>
<body>

<div class="bg-gradient"></div>

<div class="container">
    <div class="redirect-card">
        
        <span class="notice-tag">تنويه رسمي</span>

        <div class="profile-img-container">
            <img src="https://i.postimg.cc/Gmq96y4R/347590685-273239908641467-8867587916477147235-n.jpg" alt="المهندس فراس سحويل" class="profile-image">
            <div class="status-badge">مغلق</div>
        </div>

        <h1 class="name-title">المهندس فراس سحويل</h1>
        
        <p class="msg-text">
            نفيدكم علماً بأنه تم إيقاف العمل بهذا الموقع وتغييره بالكامل.<br>
            لقد انتقلنا إلى منصتنا الرقمية الجديدة بحلّة هندسية متطورة وأدوات متكاملة.
        </p>

        <div class="welcome-box">
            " أتشرف بكم جميعاً في موقعي الجديد "
        </div>

        <!-- تم توجيه الرابط ليتطابق تماماً مع رابط المنصة السحابية المحدثة -->
        <a href="https://ferassehwail.github.io/Feras-Sehwail-Engineer-Developer-/" class="cta-button" id="redirect-btn">
            <span>الانتقال للموقع الجديد الآن</span>
            <svg viewBox="0 0 24 24">
                <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
            </svg>
        </a>

        <div class="countdown-text">
            سيتم تحويلك تلقائياً خلال <span class="countdown-number" id="countdown">15</span> ثانية...
        </div>

    </div>
</div>

<script>
// إعدادات التحويل التلقائي الذكي إلى الرابط الجديد
const targetUrl = "https://ferassehwail.github.io/Feras-Sehwail-Engineer-Developer-/";
let secondsLeft = 15; // تعديل العداد إلى 15 ثانية حسب طلبك
const countdownEl = document.getElementById('countdown');

const interval = setInterval(() => {
    secondsLeft--;
    countdownEl.textContent = secondsLeft;
    
    if (secondsLeft <= 0) {
        clearInterval(interval);
        window.location.href = targetUrl;
    }
}, 1000);

// تأكيد تحويل الرابط وتصفير العداد فوراً عند النقر على الزر يدوياً لمنع أي تداخل
document.getElementById('redirect-btn').addEventListener('click', function(e) {
    clearInterval(interval);
});
</script>

</body>
</html>
